services:
  - type: web
    name: laikipia-lost-found-backend
    env: node
    buildCommand: npm install && npm install --prefix frontend && npm install --prefix backend && npm run build
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: JWT_SECRET
        generateValue: true

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: FRONTEND_URL
        value: https://laikipia-lost-found.vercel.app

      - key: DATABASE_URL
        fromDatabase:
          name: laikipia-db
          property: connectionString

databases:
  - name: laikipia-db
    plan: free
    databaseName: laikipia_lost_found
